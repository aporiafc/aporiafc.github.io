    const siteMenuButton =
      document.querySelector(".site-menu-button");


    const siteMenuPanel =
      document.querySelector(".site-menu-panel");


    const siteMenuClose =
      document.querySelector(".site-menu-close");


    const siteMenuLinks =
      document.querySelectorAll(".site-menu-nav a");


    siteMenuButton.addEventListener("click", () => {

      siteMenuPanel.classList.add("is-open");

      siteMenuButton.classList.add("is-hidden");

    });


    siteMenuClose.addEventListener("click", () => {

      siteMenuPanel.classList.remove("is-open");

      siteMenuButton.classList.remove("is-hidden");

    });


    siteMenuLinks.forEach(link => {

      link.addEventListener("click", () => {

        siteMenuPanel.classList.remove("is-open");

        siteMenuButton.classList.remove("is-hidden");

      });

    });


    siteMenuPanel.addEventListener("click", (event) => {

      if (event.target === siteMenuPanel) {

        siteMenuPanel.classList.remove("is-open");

        siteMenuButton.classList.remove("is-hidden");

      }

    });

    "sub",
    "guest"
    ];


  categoryOrder.forEach(category => {

      characterCategories[category] || [];


    characters.forEach(character => {

      label.innerHTML = `

        <input
          type="checkbox"
          name="story-character"
          value="${character}"
        >

        <span>
          ${characterNames[character] || character}

      `;


      characterSelect.appendChild(label);

    });

  });

  article.style.setProperty("transition", "none", "important");

            )

</div>

          }

        storyList.appendChild(article);

    /* =========================
       SEARCH
    ========================= */

    function searchStories() {

      const selectedTypes =
        getCheckedValues("story-type");


      const selectedCharacters =
        getCheckedValues("story-character");

      
      const selectedSupervisors =
  getCheckedValues("story-supervisor");


const selectedWriters =
  getCheckedValues("story-writer");
      

      const selectedTitle =
  storyTitleInput.value;


      const results =
        stories.filter(story => {


          /* =========================
             TYPE
          ========================= */

          if (
            selectedTypes.length > 0 &&
            !selectedTypes.includes(story.type)
          ) {

            return false;

          }



          /* =========================
             TITLE
          ========================= */

          if (
  selectedTitle &&
  story.title !== selectedTitle
) {

  return false;

}


          /* =========================
             CHARACTERS
          ========================= */

          if (
            selectedCharacters.length > 0
          ) {

            const hasAllCharacters =
              selectedCharacters.every(
                character =>
                  story.characters.includes(character)
              );


            if (!hasAllCharacters) {

              return false;

            }

          }
          
          
          /* =========================
             SUPERVISOR
          ========================= */

          if (
            selectedSupervisors.length > 0
          ) {

            const hasAllSupervisors =
              selectedSupervisors.every(
                supervisor =>
                  (story.supervisors || [])
                    .includes(supervisor)
              );


            if (!hasAllSupervisors) {

              return false;

            }

          }



          /* =========================
             WRITER
          ========================= */

          if (
            selectedWriters.length > 0
          ) {

            const hasAllWriters =
              selectedWriters.every(
                writer =>
                  (story.writers || [])
                    .includes(writer)
              );


            if (!hasAllWriters) {

              return false;

            }

          }



          return true;

        });


      renderStories([...results].reverse());

    }
    

    /* =========================
       RESET
    ========================= */

    function resetSearch() {

      document
        .querySelectorAll(
          '.story-search input[type="checkbox"]'
        )
        .forEach(input => {

          input.checked = false;

        });


      storyTitleInput.value = "";


      renderStories([...stories].reverse());

    }

  ========================= */

    renderSupervisorFilter();

  renderStories([...stories].reverse());


    /* =========================
       PAGE JUMP
    ========================= */

    const jumpTop =
      document.querySelector("#jump-top");

    const jumpBottom =
      document.querySelector("#jump-bottom");


    const resultsSection =
      document.querySelector(".story-results");

    jumpTop.addEventListener("click", () => {

      const resultsTop =
        resultsSection.getBoundingClientRect().top + window.scrollY;

      // 検索結果の先頭より下にいるなら、まず結果の先頭へ。
      // すでに結果の先頭付近(または、それより上)にいるなら、ページの一番上へ。
      const target =
        window.scrollY > resultsTop + 40
          ? resultsTop - 90
          : 0;

      window.scrollTo({
        top: target,
        behavior: "auto"
      });

    });


    jumpBottom.addEventListener("click", () => {

      window.scrollTo({
        top: document.documentElement.scrollHeight,
        behavior: "auto"
      });

    });


    window.addEventListener("scroll", () => {

      if (window.scrollY > 200) {
        jumpTop.classList.add("is-visible");
      } else {
        jumpTop.classList.remove("is-visible");
      }

    });
