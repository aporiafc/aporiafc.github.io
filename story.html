  <!-- =========================
       SCRIPT
  ========================= -->

  <script>

    /* =========================
       SITE MENU
    ========================= */

    const siteMenuButton =
      document.querySelector(".site-menu-button");

    const siteMenuPanel =
      document.querySelector(".site-menu-panel");

    const siteMenuClose =
      document.querySelector(".site-menu-close");

    const siteMenuLinks =
      document.querySelectorAll(".site-menu-nav a");


    siteMenuButton.addEventListener("click", () => {

      siteMenuPanel.classList.add("is-open");

      siteMenuButton.classList.add("is-hidden");

    });


    siteMenuClose.addEventListener("click", () => {

      siteMenuPanel.classList.remove("is-open");

      siteMenuButton.classList.remove("is-hidden");

    });


    siteMenuLinks.forEach(link => {

      link.addEventListener("click", () => {

        siteMenuPanel.classList.remove("is-open");

        siteMenuButton.classList.remove("is-hidden");

      });

    });


    siteMenuPanel.addEventListener("click", (event) => {

      if (event.target === siteMenuPanel) {

        siteMenuPanel.classList.remove("is-open");

        siteMenuButton.classList.remove("is-hidden");

      }

    });



    /* =========================
       STORY DATA
    ========================= */

    const stories = [

      /*
       * ここにストーリーを追加していく
       *
       * type:
       * main / personal / event / card
       *
       * episode:
       * 話数
       *
       * characters:
       * その話に登場するキャラクター
       *
       * viewpoints:
       * 誰視点で描かれているか
       *
       * link:
       * event / card の詳細ページ
       */


      /*
      {
        type: "main",
        title: "〇〇〇〇",
        episode: 1,

        characters: [
          "heroine",
          "ai",
          "yuzuru"
        ],

        viewpoints: [
          "heroine"
        ],

        link: ""
      },
      */


      /*
       * サンプル
       *
       * 実際のデータを入れるときに
       * この形式で追加していく。
       */

      {
        type: "main",
        title: "サンプルストーリー",
        episode: 1,

        characters: [
          "heroine",
          "ai"
        ],

        viewpoints: [
          "heroine"
        ],

        link: ""
      }

    ];



    /* =========================
       CHARACTER NAME
    ========================= */

    const characterNames = {

      heroine: "主人公",

      ai: "皇坂 逢",
      yuzuru: "城瀬 由鶴",
      roka: "須王 芦佳",

      kou: "綾戸 恋",
      mao: "宇京 真央",
      akehoshi: "樋宮 明星",
      yuragi: "環野 揺",

      taiga: "槻本 大河",
      haruhi: "壱川 春日",
      sei: "隠岐谷 誓",

      shizuka: "節見 静",
      takeru: "御門 尊",
      soyogu: "新開 戦",
      shinobu: "相沢 篠信",

      kiho: "在間 樹帆",
      kyoya: "祠堂 恭耶",
      riku: "立科 吏来",

      tomose: "恩田 灯世",
      yu: "新名 有",
      kamiya: "神家",
      urara: "麻波 麗",

      togo: "弥代 透吾",
      yukimura: "伊達 幸邑",
      ran: "天羽 嵐",
      rare: "レア"

    };



    /* =========================
       STORY TYPE NAME
    ========================= */

    const storyTypeNames = {

      main: "MAIN",
      personal: "PERSONAL",
      event: "EVENT",
      card: "CARD"

    };



    /* =========================
       ELEMENTS
    ========================= */

    const storyTitleInput =
      document.querySelector("#story-title");

    const searchButton =
      document.querySelector("#story-search-button");

    const resetButton =
      document.querySelector("#story-reset-button");

    const storyList =
      document.querySelector("#story-list");

    const resultCount =
      document.querySelector("#story-result-count");



    /* =========================
       GET SELECTED VALUES
    ========================= */

    function getCheckedValues(name) {

      return Array.from(
        document.querySelectorAll(
          `input[name="${name}"]:checked`
        )
      ).map(input => input.value);

    }



    /* =========================
       RENDER STORIES
    ========================= */

    function renderStories(results) {

      storyList.innerHTML = "";


      if (results.length === 0) {

        storyList.innerHTML = `
          <p class="story-no-result">
            該当するストーリーがありません。
          </p>
        `;

        resultCount.textContent = "0 STORIES";

        return;

      }


      resultCount.textContent =
        `${results.length} STORIES`;


      results.forEach(story => {

        const article =
          document.createElement("article");

        article.className = "story-item";


        const characters =
          story.characters
            .map(character =>
              characterNames[character] || character
            )
            .join(" / ");


        const viewpoints =
          story.viewpoints
            .map(viewpoint =>
              characterNames[viewpoint] || viewpoint
            )
            .join(" / ");


        article.innerHTML = `

          <div class="story-item-type">
            ${storyTypeNames[story.type]}
          </div>

          <div class="story-item-main">

            <h3>
              ${story.title}
            </h3>

            <p class="story-item-episode">
              EPISODE ${story.episode}
            </p>

          </div>

          <div class="story-item-info">

            <p>
              <span>CHARACTERS</span>
              ${characters}
            </p>

            <p>
              <span>VIEWPOINT</span>
              ${viewpoints}
            </p>

          </div>

          ${
            story.link
              ? `
                <a
                  href="${story.link}"
                  class="story-item-link"
                >
                  DETAIL
                </a>
              `
              : ""
          }

        `;


        storyList.appendChild(article);

      });

    }



    /* =========================
       SEARCH
    ========================= */

    function searchStories() {

      const selectedTypes =
        getCheckedValues("story-type");

      const selectedCharacters =
        getCheckedValues("story-character");

      const selectedViewpoints =
        getCheckedValues("story-viewpoint");

      const titleKeyword =
        storyTitleInput.value
          .trim()
          .toLowerCase();


      const results =
        stories.filter(story => {


          /* -------------------------
             TYPE
          ------------------------- */

          if (
            selectedTypes.length > 0 &&
            !selectedTypes.includes(story.type)
          ) {

            return false;

          }



          /* -------------------------
             TITLE
          ------------------------- */

          if (
            titleKeyword &&
            !story.title
              .toLowerCase()
              .includes(titleKeyword)
          ) {

            return false;

          }



          /* -------------------------
             CHARACTERS
          ------------------------- */

          if (
            selectedCharacters.length > 0
          ) {

            const hasAllCharacters =
              selectedCharacters.every(
                character =>
                  story.characters.includes(character)
              );

            if (!hasAllCharacters) {

              return false;

            }

          }



          /* -------------------------
             VIEWPOINT
          ------------------------- */

          if (
            selectedViewpoints.length > 0
          ) {

            const hasAllViewpoints =
              selectedViewpoints.every(
                viewpoint =>
                  story.viewpoints.includes(viewpoint)
              );

            if (!hasAllViewpoints) {

              return false;

            }

          }


          return true;

        });


      renderStories(results);

    }



    /* =========================
       RESET
    ========================= */

    function resetSearch() {

      document
        .querySelectorAll(
          '.story-search input[type="checkbox"]'
        )
        .forEach(input => {

          input.checked = false;

        });


      storyTitleInput.value = "";


      renderStories(stories);

    }



    /* =========================
       EVENTS
    ========================= */

    searchButton.addEventListener(
      "click",
      searchStories
    );


    resetButton.addEventListener(
      "click",
      resetSearch
    );



    /* =========================
       INITIAL DISPLAY
    ========================= */

    renderStories(stories);

  </script>
