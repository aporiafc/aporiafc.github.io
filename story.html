    /* =========================
       GET SELECTED VALUES
    ========================= */

    function getCheckedValues(name) {

      return Array.from(
        document.querySelectorAll(
          `input[name="${name}"]:checked`
        )
      ).map(input => input.value);

    }


    /* =========================
   GENERATE CHARACTER LIST
========================= */

function getStoryCharacters() {

  return [
    ...new Set(
      stories.flatMap(story =>
        story.characters || []
      )
    )
  ];

}


/* =========================
   RENDER CHARACTER FILTERS
========================= */

function renderCharacterFilters() {

  characterSelect.innerHTML = "";


  const categoryOrder = [
    "main",
    "other",
    "sub",
    "guest"
  ];


  categoryOrder.forEach(category => {

    const characters =
      characterCategories[category] || [];


    characters.forEach(character => {

      const label =
        document.createElement("label");


      label.innerHTML = `

        <input
          type="checkbox"
          name="story-character"
          value="${character}"
        >

        <span>
          ${characterNames[character] || character}
        </span>

      `;


      characterSelect.appendChild(label);

    });

  });

}


    /* =========================
       GENERATE VIEWPOINT LIST
    =========================
     *
     * stories に登録されている
     * viewpoints だけを自動的に取得する。
     *
     * 同じ人物が複数のストーリーに
     * 登場していても重複しない。
     */

    function getViewpointCharacters() {

      return [
        ...new Set(
          stories.flatMap(story =>
            story.viewpoints || []
          )
        )
      ];

    }


/* =========================
   RENDER TITLE FILTER
========================= */

function renderTitleFilter() {

  storyTitleInput.innerHTML = `
    <option value="">
      ALL TITLES
    </option>
  `;


  const typeOrder = [
    "main",
    "personal",
    "event",
    "card"
  ];


  typeOrder.forEach(type => {

    const titles = [
      ...new Set(
        stories
          .filter(story =>
            story.type === type
          )
          .map(story =>
            story.title
          )
      )
    ];


    titles.forEach(title => {

      const option =
        document.createElement("option");


      option.value =
        title;


      option.textContent =
        title;


      storyTitleInput.appendChild(
        option
      );

    });

  });

}

function renderStaffFilters() {

  supervisorSelect.innerHTML = "";

  const supervisors =

  const writers =

  supervisors.forEach(staff => {

    label.innerHTML = `

        name="story-supervisor"
        value="${staff}"

    supervisorSelect.appendChild(label);

  });


  writers.forEach(staff => {

      document.createElement("label");


    label.innerHTML = `

      <input
        type="checkbox"
        name="story-writer"
        value="${staff}"

      <span>
        ${staffNames[staff] || staff}
      </span>

    `;


    writerSelect.appendChild(label);

  });

}
    

    /* =========================
       RENDER STORIES
    ========================= */

    function renderStories(results) {

      storyList.innerHTML = "";


      if (results.length === 0) {

        storyList.innerHTML = `

          <p class="story-no-result">
            該当するストーリーがありません。
          </p>

        `;

        resultCount.textContent =
          "0 STORIES";

        return;

      }


      resultCount.textContent =
        `${results.length} STORIES`;


      results.forEach(story => {

        const article =
          document.createElement("article");


        article.className =
          "story-item";


        const characters =
          story.characters
            .map(character =>
              characterNames[character] || character
            )
            .join(" / ");


        const viewpoints =
          (story.viewpoints || [])
            .map(viewpoint =>
              characterNames[viewpoint] || viewpoint
            )
            .join(" / ");

        const supervisors =
  (story.supervisors || [])
    .map(supervisor =>
      staffNames[supervisor] || supervisor
    )
    .join(" / ");


const writers =
  (story.writers || [])
    .map(writer =>
      staffNames[writer] || writer
    )
    .join(" / ");


        article.innerHTML = `

          <div class="story-item-type">

            ${storyTypeNames[story.type]}

          </div>


          <div class="story-item-main">

            <h3>
              ${story.title}
            </h3>


            <p class="story-item-episode">

  第${story.episode}話

</p>

          </div>


          <div class="story-item-info">

  <p>

    <span>
      CHARACTERS
    </span>

    ${characters}

  </p>


  <p>

    <span>
      VIEWPOINT
    </span>

    ${viewpoints}

  </p>


  <p>

    <span>
      SUPERVISOR
    </span>

    ${supervisors}

  </p>


  <p>

    <span>
      WRITER
    </span>

    ${writers}

  </p>

</div>


          ${
            story.link
              ? `

                <a
                  href="${story.link}"
                  class="story-item-link"
                >
                  DETAIL
                </a>

              `
              : ""
          }

        `;


        storyList.appendChild(article);

      });

    }

  getCheckedValues("story-writer");
      

      const selectedTitle =
  storyTitleInput.value;


      const results =
        stories.filter(story => {


          /* =========================
             TYPE
          ========================= */

          if (
            selectedTypes.length > 0 &&
            !selectedTypes.includes(story.type)
          ) {

            return false;

          }



          /* =========================
             TITLE
          ========================= */

          if (
  selectedTitle &&
  story.title !== selectedTitle
) {

  return false;

}


          /* =========================
             CHARACTERS
          ========================= */

          if (
            selectedCharacters.length > 0
          ) {

            const hasAllCharacters =
              selectedCharacters.every(
                character =>
                  story.characters.includes(character)
              );


            if (!hasAllCharacters) {

              return false;

            }

          }



          /* =========================
             VIEWPOINT
          ========================= */

          if (
            selectedViewpoints.length > 0
          ) {

            const hasAllViewpoints =
              selectedViewpoints.every(
                viewpoint =>
                  (story.viewpoints || [])
                    .includes(viewpoint)
              );


            if (!hasAllViewpoints) {

              return false;

            }

          }


                    /* =========================
             SUPERVISOR
          ========================= */

          if (
            selectedSupervisors.length > 0
          ) {

            const hasAllSupervisors =
              selectedSupervisors.every(
                supervisor =>
                  (story.supervisors || [])
                    .includes(supervisor)
              );


            if (!hasAllSupervisors) {

              return false;

            }

          }



          /* =========================
             WRITER
          ========================= */

          if (
            selectedWriters.length > 0
          ) {

            const hasAllWriters =
              selectedWriters.every(
                writer =>
                  (story.writers || [])
                    .includes(writer)
              );


            if (!hasAllWriters) {

              return false;

            }

          }



          return true;

        });


      renderStories(results);

    }
    

    /* =========================
       RESET
    ========================= */

    function resetSearch() {

      document
        .querySelectorAll(
          '.story-search input[type="checkbox"]'
        )
        .forEach(input => {

          input.checked = false;

        });


      storyTitleInput.value = "";


      renderStories(stories);

    }



    /* =========================
       EVENTS
    ========================= */

    searchButton.addEventListener(
  "click",
  searchStories
);

resetButton.addEventListener(
  "click",
  resetSearch
);
    

    /* =========================
       INITIAL DISPLAY
    ========================= */

    renderTitleFilter();

renderCharacterFilters();

renderViewpointFilters();

renderStaffFilters();

renderStories(stories);

  </script>


</body>
</html>
