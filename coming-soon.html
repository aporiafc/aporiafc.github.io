  <style>
    /* =========================
       COMING SOON（このページ専用）
       style.css と衝突しないよう wip- を頭に付けています
    ========================= */

    .wip-page {
      --wip-ink: #222;
      --wip-paper: #fff;
      --wip-line: rgba(34, 34, 34, 0.14);
      --wip-soft: rgba(34, 34, 34, 0.6);

      min-height: 100vh;
      box-sizing: border-box;
      padding: 140px 24px 96px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      color: var(--wip-ink);
    }

    .wip-name {
      margin: 0 0 8px;
      font-size: 14px;
      letter-spacing: 0.2em;
      color: var(--wip-soft);
    }

    /* ---------- 吊り下げ看板 ---------- */

    .wip-hanger {
      position: relative;
      width: 280px;
      height: 200px;
      margin: 24px 0 8px;
      perspective: 900px;
      transform-origin: 50% 0;
      animation: wip-swing 3.2s ease-out 0.3s 1 both;
    }

    .wip-hanger::before,
    .wip-hanger::after {
      content: "";
      position: absolute;
      top: -48px;
      width: 1px;
      height: 64px;
      background: var(--wip-ink);
      opacity: 0.5;
    }
    .wip-hanger::before { left: 64px;  transform: rotate(-14deg); transform-origin: 50% 100%; top: -46px; }
    .wip-hanger::after  { right: 64px; transform: rotate(14deg);  transform-origin: 50% 100%; top: -46px; }

    .wip-sign {
      all: unset;
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.3, 1.4, 0.5, 1);
    }
    .wip-sign:focus-visible {
      outline: 2px solid var(--wip-ink);
      outline-offset: 8px;
    }
    .wip-sign.is-flipped { transform: rotateY(180deg); }

    .wip-face {
      position: absolute;
      inset: 0;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border: 2px solid var(--wip-ink);
      border-radius: 6px;
      background: var(--wip-paper);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .wip-face::before {
      content: "";
      position: absolute;
      inset: 7px;
      border: 1px solid var(--wip-line);
      border-radius: 3px;
    }
    .wip-face.is-back { transform: rotateY(180deg); }

    .wip-face-main {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: 0.18em;
      padding-left: 0.18em;
      line-height: 1.1;
    }
    .wip-face-sub {
      font-size: 13px;
      letter-spacing: 0.3em;
      color: var(--wip-soft);
    }
    .wip-face.is-back .wip-face-main { font-size: 30px; letter-spacing: 0.08em; }

    @keyframes wip-swing {
      0%   { transform: rotate(7deg); }
      25%  { transform: rotate(-5deg); }
      50%  { transform: rotate(3deg); }
      75%  { transform: rotate(-1.5deg); }
      100% { transform: rotate(0); }
    }

    .wip-hint {
      margin: 20px 0 0;
      font-size: 12px;
      color: var(--wip-soft);
    }

    /* ---------- ひとこと ---------- */

    .wip-title {
      margin: 48px 0 0;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.25em;
      color: var(--wip-soft);
    }

    .wip-message {
      min-height: 4.8em;
      max-width: 30em;
      margin: 12px 0 0;
      font-size: 17px;
      line-height: 1.9;
    }

    /* ---------- 進捗バー（87%から動かない） ---------- */

    .wip-progress {
      width: min(340px, 100%);
      margin: 32px 0 0;
    }
    .wip-progress-head {
      display: flex;
      justify-content: space-between;
      margin: 0 0 8px;
      font-size: 12px;
      color: var(--wip-soft);
    }
    .wip-progress-bar {
      height: 8px;
      border: 1px solid var(--wip-ink);
      border-radius: 99px;
      overflow: hidden;
    }
    .wip-progress-bar span {
      display: block;
      width: 78%;
      height: 100%;
      background: repeating-linear-gradient(
        -45deg,
        var(--wip-ink) 0 6px,
        transparent 6px 12px
      );
      transform-origin: left;
      animation: wip-fill 1.6s ease-out 0.4s both;
    }
    @keyframes wip-fill { from { transform: scaleX(0); } }

    .wip-progress-note {
      margin: 10px 0 0;
      font-size: 12px;
      color: var(--wip-soft);
    }

    /* ---------- 戻りリンク ---------- */

    .wip-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 28px;
      margin: 56px 0 0;
    }
    .wip-links a {
      padding: 4px 2px;
      color: var(--wip-soft);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 0.1em;
      border-bottom: 1px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .wip-links a:hover,
    .wip-links a:focus-visible {
      color: var(--wip-ink);
      border-bottom-color: var(--wip-ink);
    }

    @media (max-width: 600px) {
      .wip-page { padding-top: 120px; }
      .wip-face-main { font-size: 42px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .wip-hanger,
      .wip-progress-bar span { animation: none; }
      .wip-sign { transition: none; }
    }
  </style>
</head>

  <!-- =========================
       SCRIPT
  ========================= -->

  <script>

    /* =========================
       SITE MENU
    ========================= */

    const siteMenuButton = document.querySelector(".site-menu-button");
    const siteMenuPanel  = document.querySelector(".site-menu-panel");
    const siteMenuClose  = document.querySelector(".site-menu-close");
    const siteMenuLinks  = document.querySelectorAll(".site-menu-nav a");

    function closeMenu() {
      siteMenuPanel.classList.remove("is-open");
      siteMenuButton.classList.remove("is-hidden");
    }

    siteMenuButton.addEventListener("click", () => {
      siteMenuPanel.classList.add("is-open");
      siteMenuButton.classList.add("is-hidden");
    });

    siteMenuClose.addEventListener("click", closeMenu);
    siteMenuLinks.forEach(link => link.addEventListener("click", closeMenu));

    siteMenuPanel.addEventListener("click", (event) => {
      if (event.target === siteMenuPanel) closeMenu();
    });


    /* =========================================================
       ▼▼▼ 編集（ページごとの表示内容） ▼▼▼
    ========================================================= */

    const pages = {

      music: {
        title: "MUSIC は準備中です",
        label: "MUSIC",
        back: "選曲会議中",
        messages: [
          "ジュークボックスのコンセントを探しています。",
          "選曲は慎重に。いまレコード棚の前で腕組みしています。",
          "音量つまみは「ほどほど」に合わせました。",
          "もう少しだけ、静かな店内でお待ちください。"
        ]
      },

      media: {
        title: "MEDIA は準備中です",
        label: "MEDIA",
        back: "整理整頓中",
        messages: [
          "掲載情報を仕分け中です。段ボールがまだ半分残っています。",
          "切り抜きの山が、机からはみ出しました。",
          "整理整頓は、後回しにするほど大変になるそうです。",
          "清掃係が退勤するまで、もう少しお待ちください。"
        ]
      },

      xstmy: {
        title: "× stmy は準備中です",
        label: "× stmy",
        back: "紅茶を蒸らし中",
        messages: [
          "『スタンドマイヒーローズ』10周年おめでとうございます。",
          "打ち合わせの紅茶が、そろそろ冷めかけています。",
          "お届けの準備を、いま丁寧に進めています。",
          "香りを楽しみながら、暫しお待ちください。"
        ]
      },

      glossary: {
        title: "GLOSSARY は準備中です",
        label: "GLOSSARY",
        back: "索引づくり中",
        messages: [
          "言葉を一つずつ、丁寧に拾い集めています。",
          "付箋が増えすぎて、辞書がふくらんできました。",
          "索引づくりは、思ったより奥が深いようです。",
          "準備が整うまで、他の資料をめくってお待ちください。"
        ]
      }

    };

    const fallbackPage = {
      title: "この先は準備中です",
      label: "",
      back: "もうちょっと準備中",
      messages: [
        "ただいま仕込み中です。",
        "もう少しだけ、お待ちください。"
      ]
    };

    /* =========================================================
       ▲▲▲ 編集 ▲▲▲
    ========================================================= */


    /* =========================
       PAGE CONTENT
    ========================= */

    const key  = new URLSearchParams(location.search).get("page");
    const data = pages[key] || fallbackPage;

    const titleEl   = document.querySelector("#wip-title");
    const messageEl = document.querySelector("#wip-message");
    const signEl    = document.querySelector("#wip-sign");

    titleEl.textContent = data.title;
    document.querySelector("#wip-back").textContent = data.back;
    document.title = (data.label ? data.label + " | " : "") + "準備中 | Aporia fancafe";

    let index = 0;
    messageEl.textContent = data.messages[index];


    /* =========================
       SIGN: クリックで看板を返し、ひとことも切り替える
    ========================= */

    signEl.addEventListener("click", () => {
      signEl.classList.toggle("is-flipped");
      index = (index + 1) % data.messages.length;
      messageEl.textContent = data.messages[index];
    });

  </script>
