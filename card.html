    /* =========================================================
       ▲▲▲ ここまで編集する場所 ▲▲▲

    /* =========================
       ELEMENTS
    ========================= */

    const rarityFilter = document.querySelector("#card-rarity-select");
    const characterFilter = document.querySelector("#card-character-select");
    const combinationSelect = document.querySelector("#card-combination-select");
    const attributeFilter = document.querySelector("#card-attribute-select");
    const leaderSkillFilter = document.querySelector("#card-leader-skill-select");
    const autoSkillFilter = document.querySelector("#card-auto-skill-select");
    const spSkillFilter = document.querySelector("#card-sp-skill-select");

    const searchButton = document.querySelector("#card-search-button");
    const resetButton = document.querySelector("#card-reset-button");

    const cardGrid = document.querySelector("#card-search-grid");
    const resultCount = document.querySelector("#card-result-count");


    /* =========================
       GET SELECTED VALUES
    ========================= */

    function getCheckedValues(name) {
      return Array.from(
        document.querySelectorAll(`input[name="${name}"]:checked`)
      ).map(input => input.value);
    }


    /* =========================
       RENDER: TAG PILL FILTER
    ========================= */

    function renderTagFilter(container, tagMap, inputName) {
      container.innerHTML = "";

      Object.keys(tagMap).forEach(key => {
        const label = document.createElement("label");

        label.innerHTML = `
          <input type="checkbox" name="${inputName}" value="${key}">
          <span>${tagMap[key]}</span>
        `;

        container.appendChild(label);
      });
    }


    /* =========================
       RENDER: FILTERS
    ========================= */

    function renderRarityFilter() {
      rarityFilter.innerHTML = "";

      rarityOrder.forEach(rarity => {
        const label = document.createElement("label");

        label.innerHTML = `
          <input type="checkbox" name="card-rarity" value="${rarity}">
          <span>${rarity}</span>
        `;

        rarityFilter.appendChild(label);
      });
    }

        function renderCharacterFilter() {
      characterFilter.innerHTML = "";

      characterOrder.forEach(character => {
        const label = document.createElement("label");

        label.innerHTML = `
          <input type="checkbox" name="card-character" value="${character}">
          <span>${characterNames[character]}</span>
        `;

        characterFilter.appendChild(label);
      });
    }

    function renderCombinationSelect() {
      combinationSelect.innerHTML = `<option value="">ALL</option>`;

      characterOrder.forEach(character => {
        const option = document.createElement("option");

        option.value = character;
        option.textContent = characterNames[character];

        combinationSelect.appendChild(option);
      });
    }

    function renderAttributeFilter() {
      attributeFilter.innerHTML = "";

      Object.keys(attributeNames).forEach(key => {
        const label = document.createElement("label");

        label.innerHTML = `
          <input type="checkbox" name="card-attribute" value="${key}">
          <span>${attributeNames[key]}</span>
        `;

        attributeFilter.appendChild(label);
      });
    }


    /* =========================
       RENDER: CARDS
    ========================= */

    function renderCards(results) {
      cardGrid.innerHTML = "";

      if (results.length === 0) {
        cardGrid.innerHTML = `<p class="story-no-result">該当するカードがありません。</p>`;
        resultCount.textContent = "0 CARDS";
        return;
      }

      resultCount.textContent = `${results.length} CARDS`;

      results.forEach(card => {
        const item = document.createElement("a");

        item.className = "card-search-item";
        item.href = card.link || "#";
        item.style.setProperty(
          "--character-color",
          characterColors[card.character] || "#777"
        );

        const imageHTML = card.image
          ? `<img src="${card.image}" alt="${card.title}">`
          : `<span>CARD</span>`;

        const combinationText = card.combination
          ? characterNames[card.combination] || card.combination
          : "-";

        const attributeText = attributeNames[card.attribute] || "-";

        item.innerHTML = `

          <div class="card-search-image">
            ${imageHTML}
          </div>

          <div class="card-search-info">

            <p class="card-search-rarity">
              ${card.rarity} ／ ${characterNames[card.character] || card.character}
            </p>

            <h3 class="card-search-title">
              ${card.title}
            </h3>

            <p class="card-search-meta">
              属性：${attributeText}<br>
              コンビネーション：${combinationText}
            </p>

          </div>

        `;

        cardGrid.appendChild(item);
      });
    }


    /* =========================
       SEARCH
    ========================= */

    function searchCards() {

      const selectedRarities = getCheckedValues("card-rarity");
      const selectedCharacters = getCheckedValues("card-character");
      const selectedCombination = combinationSelect.value;
      const selectedAttributes = getCheckedValues("card-attribute");
      const selectedLeaderTags = getCheckedValues("card-leader-skill");
      const selectedAutoTags = getCheckedValues("card-auto-skill");
      const selectedSpTags = getCheckedValues("card-sp-skill");

      const results = cards.filter(card => {

        if (selectedRarities.length > 0 && !selectedRarities.includes(card.rarity)) {
          return false;
        }

        if (selectedCharacters.length > 0 && !selectedCharacters.includes(card.character)) {
          return false;
        }

        if (selectedCombination && card.combination !== selectedCombination) {
          return false;
        }

        if (selectedAttributes.length > 0 && !selectedAttributes.includes(card.attribute)) {
          return false;
        }

        if (selectedLeaderTags.length > 0) {
          const hasAll = selectedLeaderTags.every(tag =>
            (card.leaderSkillTags || []).includes(tag)
          );
          if (!hasAll) return false;
        }

        if (selectedAutoTags.length > 0) {
          const hasAll = selectedAutoTags.every(tag =>
            (card.autoSkillTags || []).includes(tag)
          );
          if (!hasAll) return false;
        }

        if (selectedSpTags.length > 0) {
          const hasAll = selectedSpTags.every(tag =>
            (card.spSkillTags || []).includes(tag)
          );
          if (!hasAll) return false;
        }

        return true;

      });

      renderCards(results);
    }


    /* =========================
       RESET
    ========================= */

    function resetSearch() {
      document
        .querySelectorAll('.story-search input[type="checkbox"]')
        .forEach(input => { input.checked = false; });

      combinationSelect.value = "";

      renderCards(cards);
    }


    /* =========================
       EVENTS
    ========================= */

    searchButton.addEventListener("click", searchCards);
    resetButton.addEventListener("click", resetSearch);


    /* =========================
       INITIAL DISPLAY
    ========================= */

    renderRarityFilter();
    renderCharacterFilter();
    renderCombinationSelect();
    renderAttributeFilter();
    renderTagFilter(leaderSkillFilter, leaderSkillTags, "card-leader-skill");
    renderTagFilter(autoSkillFilter, autoSkillTags, "card-auto-skill");
    renderTagFilter(spSkillFilter, spSkillTags, "card-sp-skill");

    renderCards(cards);

  </script>
