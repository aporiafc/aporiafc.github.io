      yearOrder.forEach(year => {
        const label = document.createElement("label");

        label.innerHTML = `
          <input type="checkbox" name="event-year" value="${year}">
          <span>${year}</span>
        `;

        yearFilter.appendChild(label);
      });
    }

    function renderGenreFilter() {
      genreFilter.innerHTML = "";

      Object.keys(genreNames).forEach(key => {
        const label = document.createElement("label");

        label.innerHTML = `
          <input type="checkbox" name="event-genre" value="${key}">
          <span>${genreNames[key]}</span>
        `;

        genreFilter.appendChild(label);
      });
    }

    function renderCharacterFilter() {
      characterFilter.innerHTML = "";

      characterOrder.forEach(character => {
        const label = document.createElement("label");

        label.innerHTML = `
          <input type="checkbox" name="event-character" value="${character}">
          <span>${characterNames[character]}</span>
        `;

        characterFilter.appendChild(label);
      });
    }

        function renderEventTypeFilter() {
      eventTypeFilter.innerHTML = "";

      Object.keys(eventTypeNames).forEach(key => {
        const label = document.createElement("label");

        label.innerHTML = `
          <input type="checkbox" name="event-type" value="${key}">
          <span>${eventTypeNames[key]}</span>
        `;

        eventTypeFilter.appendChild(label);
      });
    }


    /* =========================
       RENDER: EVENTS
    ========================= */

    function renderEvents(results) {
      eventGrid.innerHTML = "";

      if (results.length === 0) {
        eventGrid.innerHTML = `<p class="story-no-result">該当するイベントがありません。</p>`;
        resultCount.textContent = "0 EVENTS";
        return;
      }

      resultCount.textContent = `${results.length} EVENTS`;

      results.forEach(event => {
        const item = document.createElement("a");

        item.className = "event-search-item";
        item.href = event.link || "#";

        const imageHTML = event.image
          ? `<img src="${event.image}" alt="${event.title}">`
          : `<span>EVENT</span>`;
        
        const genreText = (event.genre || [])
          .map(key => `<span class="event-search-genre-tag">${genreNames[key] || key}</span>`)
          .join("");

        item.innerHTML = `

          <div class="event-search-image">
            ${imageHTML}
          </div>

          <div class="event-search-info">

            <p class="event-search-genre">
              ${genreText}
            </p>

            <h3 class="event-search-title">
              ${event.title}
            </h3>

            <p class="event-search-meta">
              期間：${event.period || "-"}
            </p>

          </div>

        `;

        eventGrid.appendChild(item);
      });
    }


    /* =========================
       SEARCH
    ========================= */

    function searchEvents() {

      const selectedYears = getCheckedValues("event-year");
      const selectedGenres = getCheckedValues("event-genre");
      const selectedEventTypes = getCheckedValues("event-type");
      const selectedCharacters = getCheckedValues("event-character");

      const results = events.filter(event => {

        if (selectedYears.length > 0 && !selectedYears.includes(event.year)) {
          return false;
        }

        if (selectedGenres.length > 0) {
          const hasAny = selectedGenres.some(genreKey =>
            (event.genre || []).includes(genreKey)
          );
          if (!hasAny) return false;
        }

        if (selectedEventTypes.length > 0 && !selectedEventTypes.includes(event.eventType)) {
          return false;
        }

        if (selectedCharacters.length > 0) {
          const hasAll = selectedCharacters.every(character =>
            (event.characters || []).includes(character)
          );
          if (!hasAll) return false;
        }

        return true;

      });

      renderEvents(results);
    }


    /* =========================
       RESET
    ========================= */

    function resetSearch() {
      document
        .querySelectorAll('.story-search input[type="checkbox"]')
        .forEach(input => { input.checked = false; });

      renderEvents(events);
    }


    /* =========================
       EVENTS (LISTENERS)
    ========================= */

    searchButton.addEventListener("click", searchEvents);
    resetButton.addEventListener("click", resetSearch);


    /* =========================
       INITIAL DISPLAY
    ========================= */

    renderYearFilter();
    renderGenreFilter();
    renderEventTypeFilter();
    renderCharacterFilter();

    renderEvents(events);

  </script>

</body>
</html>
