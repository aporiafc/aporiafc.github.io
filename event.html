  <!-- =========================
       SCRIPT
  ========================= -->

  <script>

    /* =========================
       SITE MENU
    ========================= */

    const siteMenuButton = document.querySelector(".site-menu-button");
    const siteMenuPanel = document.querySelector(".site-menu-panel");
    const siteMenuClose = document.querySelector(".site-menu-close");
    const siteMenuLinks = document.querySelectorAll(".site-menu-nav a");

    siteMenuButton.addEventListener("click", () => {
      siteMenuPanel.classList.add("is-open");
      siteMenuButton.classList.add("is-hidden");
    });

    siteMenuClose.addEventListener("click", () => {
      siteMenuPanel.classList.remove("is-open");
      siteMenuButton.classList.remove("is-hidden");
    });

    siteMenuLinks.forEach(link => {
      link.addEventListener("click", () => {
        siteMenuPanel.classList.remove("is-open");
        siteMenuButton.classList.remove("is-hidden");
      });
    });

    siteMenuPanel.addEventListener("click", (event) => {
      if (event.target === siteMenuPanel) {
        siteMenuPanel.classList.remove("is-open");
        siteMenuButton.classList.remove("is-hidden");
      }
    });


    /* =========================================================
       ▼▼▼ 編集 ▼▼▼
    ========================================================= */

    /* =========================
       CHARACTER NAME
       （キャラを増やすときはここに追加）
    ========================= */

    const characterOrder = [
      "ai", "yuzuru", "roka",
      "kou", "mao", "akehoshi", "yuragi",
      "taiga", "haruhi", "sei",
      "shizuka", "takeru", "soyogu", "shinobu",
      "kiho", "kyoya", "riku",
      "tomose", "yu", "kamiya", "urara"
    ];

    const characterNames = {
      ai: "皇坂 逢",
      yuzuru: "城瀬 由鶴",
      roka: "須王 芦佳",
      kou: "綾戸 恋",
      mao: "宇京 真央",
      akehoshi: "樋宮 明星",
      yuragi: "環野 揺",
      taiga: "槻本 大河",
      haruhi: "壱川 春日",
      sei: "隠岐谷 誓",
      shizuka: "節見 静",
      takeru: "御門 尊",
      soyogu: "新開 戦",
      shinobu: "相沢 篠信",
      kiho: "在間 樹帆",
      kyoya: "祠堂 恭耶",
      riku: "立科 吏来",
      tomose: "恩田 灯世",
      yu: "新名 有",
      kamiya: "神家",
      urara: "麻波 麗"
    };


    /* =========================
       YEAR
       （開催年を増やすときはここに追加）
    ========================= */

    const yearOrder = ["2024", "2025", "2026"];


    /* =========================
       GENRE
       （ジャンルを増やすときはここに追加）
    ========================= */

    const genreNames = {
      prequel: "前日譚",
      agency: "代行業務",
      dressup: "ドレスアップ",
      daily: "日常",
      parody: "パロ"
    };


   /* =========================
       EVENT TYPE
       （イベント形式を増やすときはここに追加）
    ========================= */

    const eventTypeNames = {
      normal: "通常",
      point: "ポイント累計",
      cafebar: "カフェバー",
      ojt: "OJT",
      vignette: "Vignette",
      other: "その他"
    };


    /* =========================
       EVENTS
       （イベントを増やすときは、この配列に
         オブジェクトを1つ追加するだけでOK）
    ========================= */

    const events = [

{
  year: "2024",
  genre: ["prequel", "agency"],
  eventType: "point",
  title: "Prequel 揺蕩う泡沫の春に",
  image: "",
  period: "2024/6/18 - 2024/6/21",
  characters: ["kou", "mao", "akehoshi", "roka", "ai", "yuragi"],
  link: ""
},
      
{
  year: "2024",
  genre: ["agency", "dressup"],
  eventType: "normal",
  title: "シルクにかさねるDecoration",
  image: "",
  period: "2024/6/4 - 2024/6/17",
  characters: ["ai", "shizuka", "shinobu", "sei", "takeru", "yu"],
  link: ""
},
      
{
  year: "2024",
  genre: ["agency", "dressup"],
  eventType: "normal",
  title: "Florist 花に染む言の葉",
  image: "images/event/event1_story_banner.png",
  period: "2024/5/17 - 2024/5/30",
  characters: ["yuzuru", "kiho", "tomose", "riku", "mao", "ai"],
  link: ""
},

      /*
      {
        year: "2026",
        genre: "prequel",
        title: "イベントタイトル",
        image: "images/event/xxx.png",
        period: "2026.02.01 〜 2026.02.14",
        characters: ["shizuka", "takeru"],
        link: "event-xxx.html"
      },
      */

    ];

    /* =========================================================
       ▲▲▲ ここまで編集する場所 ▲▲▲
    ========================================================= */


    /* =========================
       ELEMENTS
    ========================= */

    const yearFilter = document.querySelector("#event-year-select");
    const genreFilter = document.querySelector("#event-genre-select");
    const characterFilter = document.querySelector("#event-character-select");

    const searchButton = document.querySelector("#event-search-button");
    const resetButton = document.querySelector("#event-reset-button");

    const eventGrid = document.querySelector("#event-search-grid");
    const resultCount = document.querySelector("#event-result-count");

    const eventTypeFilter = document.querySelector("#event-type-select");


    /* =========================
       GET SELECTED VALUES
    ========================= */

    function getCheckedValues(name) {
      return Array.from(
        document.querySelectorAll(`input[name="${name}"]:checked`)
      ).map(input => input.value);
    }


    /* =========================
       RENDER: FILTERS
    ========================= */

    function renderYearFilter() {
      yearFilter.innerHTML = "";

      yearOrder.forEach(year => {
        const label = document.createElement("label");

        label.innerHTML = `
          <input type="checkbox" name="event-year" value="${year}">
          <span>${year}</span>
        `;

        yearFilter.appendChild(label);
      });
    }

    function renderGenreFilter() {
      genreFilter.innerHTML = "";

      Object.keys(genreNames).forEach(key => {
        const label = document.createElement("label");

        label.innerHTML = `
          <input type="checkbox" name="event-genre" value="${key}">
          <span>${genreNames[key]}</span>
        `;

        genreFilter.appendChild(label);
      });
    }

    function renderCharacterFilter() {
      characterFilter.innerHTML = "";

      characterOrder.forEach(character => {
        const label = document.createElement("label");

        label.innerHTML = `
          <input type="checkbox" name="event-character" value="${character}">
          <span>${characterNames[character]}</span>
        `;

        characterFilter.appendChild(label);
      });
    }

        function renderEventTypeFilter() {
      eventTypeFilter.innerHTML = "";

      Object.keys(eventTypeNames).forEach(key => {
        const label = document.createElement("label");

        label.innerHTML = `
          <input type="checkbox" name="event-type" value="${key}">
          <span>${eventTypeNames[key]}</span>
        `;

        eventTypeFilter.appendChild(label);
      });
    }


    /* =========================
       RENDER: EVENTS
    ========================= */

    function renderEvents(results) {
      eventGrid.innerHTML = "";

      if (results.length === 0) {
        eventGrid.innerHTML = `<p class="story-no-result">該当するイベントがありません。</p>`;
        resultCount.textContent = "0 EVENTS";
        return;
      }

      resultCount.textContent = `${results.length} EVENTS`;

      results.forEach(event => {
        const item = document.createElement("a");

        item.className = "event-search-item";
        item.href = event.link || "#";

        const imageHTML = event.image
          ? `<img src="${event.image}" alt="${event.title}">`
          : `<span>EVENT</span>`;
        
        const genreText = (event.genre || [])
          .map(key => genreNames[key] || key)
          .join(" / ");

        item.innerHTML = `

          <div class="event-search-image">
            ${imageHTML}
          </div>

          <div class="event-search-info">

            <p class="event-search-genre">
              ${genreText}
            </p>

            <h3 class="event-search-title">
              ${event.title}
            </h3>

            <p class="event-search-meta">
              期間：${event.period || "-"}
            </p>

          </div>

        `;

        eventGrid.appendChild(item);
      });
    }


    /* =========================
       SEARCH
    ========================= */

    function searchEvents() {

      const selectedYears = getCheckedValues("event-year");
      const selectedGenres = getCheckedValues("event-genre");
      const selectedEventTypes = getCheckedValues("event-type");
      const selectedCharacters = getCheckedValues("event-character");

      const results = events.filter(event => {

        if (selectedYears.length > 0 && !selectedYears.includes(event.year)) {
          return false;
        }

        if (selectedGenres.length > 0) {
          const hasAny = selectedGenres.some(genreKey =>
            (event.genre || []).includes(genreKey)
          );
          if (!hasAny) return false;
        }

        if (selectedEventTypes.length > 0 && !selectedEventTypes.includes(event.eventType)) {
          return false;
        }

        if (selectedCharacters.length > 0) {
          const hasAll = selectedCharacters.every(character =>
            (event.characters || []).includes(character)
          );
          if (!hasAll) return false;
        }

        return true;

      });

      renderEvents(results);
    }


    /* =========================
       RESET
    ========================= */

    function resetSearch() {
      document
        .querySelectorAll('.story-search input[type="checkbox"]')
        .forEach(input => { input.checked = false; });

      renderEvents(events);
    }


    /* =========================
       EVENTS (LISTENERS)
    ========================= */

    searchButton.addEventListener("click", searchEvents);
    resetButton.addEventListener("click", resetSearch);


    /* =========================
       INITIAL DISPLAY
    ========================= */

    renderYearFilter();
    renderGenreFilter();
    renderEventTypeFilter();
    renderCharacterFilter();

    renderEvents(events);

  </script>

</body>
