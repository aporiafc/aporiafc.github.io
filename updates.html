<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Update Log | Aporia fancafe</title>

  <link rel="icon" href="favicon.png" type="image/png">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="updates">

    <p class="updates-label">UPDATE LOG</p>

    <h1>Update Log</h1>

    <p class="updates-description">
      サイトの更新履歴を記録しています。
    </p>

    <div class="update-list">

      <article class="update-item">
        <time datetime="2026-08-22">2026.08.22</time>
        <h2>サイト公開準備</h2>
        <p>
          トップページのデザインを整えました。
        </p>
      </article>

      <article class="update-item">
        <time datetime="2026-08-22">2026.08.22</time>
        <h2>UPDATE LOGを追加</h2>
        <p>
          更新履歴ページへのリンクをトップページに追加しました。
        </p>
      </article>

    </div>

    <a class="back-link" href="index.html">BACK TO HOME</a>

  </main>
  

  <script>
  /* =========================
     SITE MENU
  ========================= */

  const siteMenuButton = document.querySelector(".site-menu-button");
  const siteMenuPanel = document.querySelector(".site-menu-panel");
  const siteMenuClose = document.querySelector(".site-menu-close");
  const siteMenuLinks = document.querySelectorAll(".site-menu-nav a");


  /* =========================
     SITE MENU：OPEN / CLOSE
  ========================= */

  siteMenuButton.addEventListener("click", () => {
    siteMenuPanel.classList.add("is-open");
    siteMenuButton.classList.add("is-hidden");
  });

  siteMenuClose.addEventListener("click", () => {
    siteMenuPanel.classList.remove("is-open");
    siteMenuButton.classList.remove("is-hidden");
  });

  siteMenuLinks.forEach(link => {
    link.addEventListener("click", () => {
      siteMenuPanel.classList.remove("is-open");
      siteMenuButton.classList.remove("is-hidden");
    });
  });

  siteMenuPanel.addEventListener("click", (event) => {
    if (event.target === siteMenuPanel) {
      siteMenuPanel.classList.remove("is-open");
      siteMenuButton.classList.remove("is-hidden");
    }
  });

</script>

</body>
</html>
